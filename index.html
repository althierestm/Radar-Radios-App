<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radar Rádios - Rádios Online Gratis</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="radio-container">
        
        <header class="radio-header">
            <span class="badge-pais" id="badge-pais">Brasil</span>
            <button id="btn-fav" class="icon-btn fav-btn"><i class="fa-regular fa-star" id="fav-icon"></i></button>
        </header>

        
        <div class="display-container">
            <div class="frequencia-principal">
                <span id="freq-valor">87.9</span>
                
                <div class="fm-airplay-group">
                    <svg id="airplay-btn" class="airplay-icon" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 16l-4 5h8l-4-5z" fill="currentColor" stroke="none" />
                        <path d="M8 13a6 6 0 0 1 8 0" />
                        <path d="M5 10a10 10 0 0 1 14 0" />
                        <path d="M2 7a14 14 0 0 1 20 0" />
                    </svg>
                    <small>FM</small>
                </div>
            </div>
            
            <div class="textos-fixos">
                <div class="nome-estacao" id="estacao-nome">Carregando...</div>
                <div class="status-conexao" id="status-conexao">Toque no Play</div>
            </div>
        </div>

        
        <div class="secondary-actions">
            <button class="icon-btn" id="btn-config" title="Configurações e Favoritos"><i class="fa-solid fa-gear"></i></button>
            <button class="icon-btn" id="btn-lista" title="Lista de Estações"><i class="fa-solid fa-list-ul"></i></button>
            <button class="icon-btn" id="btn-share" title="Compartilhar"><i class="fa-solid fa-arrow-up-from-bracket"></i></button>
        </div>

        
        <div class="dial-container" id="dial-container">
            <div class="dial-needle"></div>
            <div class="dial-strip" id="dial-strip">
                
            </div>
        </div>

        
        <div class="player-controls">
            <button class="ctrl-btn" id="btn-prev"><i class="fa-solid fa-backward-step"></i></button>
            <button class="ctrl-btn main-play" id="btn-play"><i class="fa-solid fa-play" id="play-icon"></i></button>
            <button class="ctrl-btn" id="btn-next"><i class="fa-solid fa-forward-step"></i></button>
        </div>
    </div>

    
    <div class="modal" id="modal-estacoes">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Todas as Estações</h3>
                <button class="close-btn fechar-modal">&times;</button>
            </div>
            <div class="search-box">
                <input type="text" id="filtra-estacao" placeholder="Filtrar por nome ou cidade...">
            </div>
            <ul class="station-list" id="station-list"></ul>
        </div>
    </div>

    <
    <div class="modal" id="modal-config">
        <div class="modal-content config-unified">
            <div class="modal-header">
                <h3>Configurações</h3>
                <button class="close-btn fechar-config">&times;</button>
            </div>
            
            <div class="unified-scroll-area">
                <ul class="config-list">
                    <li>
                        <span>Modo Claro</span> 
                        <label class="ios-switch">
                            <input type="checkbox" id="theme-toggle">
                            <span class="ios-slider"></span>
                        </label>
                    </li>
                    <li>
                        <span>Efeitos Sonoros de Rádio</span> 
                        <label class="ios-switch">
                            <input type="checkbox" id="noise-toggle" checked>
                            <span class="ios-slider"></span>
                        </label>
                    </li>
                    <li>
                        <span>Evitar Bloqueio de Tela</span> 
                        <label class="ios-switch">
                            <input type="checkbox" id="wakelock-toggle">
                            <span class="ios-slider"></span>
                        </label>
                    </li>
                    <li>
                        <span>Temporizador</span>
                        <select id="timer-select" class="custom-select">
                            <option value="0">Desativado</option>
                            <option value="15">15 min</option>
                            <option value="20">20 min</option>
                            <option value="30">30 min</option>
                            <option value="45">45 min</option>
                            <option value="60">1 Hora</option>
                            <option value="75">1h 15m</option>
                            <option value="90">1h 30m</option>
                        </select>
                    </li>
                    
                    <li id="btn-whatsapp" class="clickable-row">
                        <div class="row-icon-text">
                            <i class="fa-solid fa-paper-plane" style="color: #1f37ba;"></i>
                            <span>Enviar uma estação</span>
                        </div>
                        <i class="fa-solid fa-chevron-right" style="color: var(--text-muted); font-size: 14px;"></i>
                    </li>
                </ul>

                
                <div class="section-divider">Minhas Favoritas</div>
                <ul class="station-list" id="favoritas-list"></ul>
            </div>
        </div>
    </div>

    <audio id="audio-stream" preload="none"></audio>
    <script src="app.js"></script>
</body>
</html>
