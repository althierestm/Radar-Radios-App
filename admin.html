<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Radar Rádios</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #000000; --bg-container: #111111; --text-primary: #ffffff;
            --text-secondary: #888888; --accent: #1f37ba; --border: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-primary); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        /* Login Screen */
        #login-screen { background: var(--bg-container); padding: 40px; border-radius: 20px; border: 1px solid var(--border); width: 100%; max-width: 400px; text-align: center; }
        #login-screen h2 { margin-bottom: 20px; color: var(--accent); }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .input-group input, .input-group select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: #1a1a1a; color: white; outline: none; font-size: 14px; }
        .input-group input:focus, .input-group select:focus { border-color: var(--accent); }
        button.btn { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button.btn:hover { filter: brightness(1.2); }
        
        /* Admin Panel */
        #admin-panel { display: none; width: 100%; max-width: 1000px; background: var(--bg-container); border-radius: 20px; padding: 30px; border: 1px solid var(--border); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 30px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        
        /* Formulário */
        .form-panel { background: #1a1a1a; padding: 20px; border-radius: 12px; border: 1px solid var(--border); height: fit-content; }
        .form-panel h3 { margin-bottom: 20px; font-size: 18px; color: var(--accent); }
        .btn-group { display: flex; gap: 10px; }
        .btn-cancel { background: transparent; border: 1px solid var(--text-secondary); }
        
        /* Lista */
        .list-panel { max-height: 600px; overflow-y: auto; padding-right: 10px; }
        .radio-item { background: #1a1a1a; border: 1px solid var(--border); border-radius: 10px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .radio-info strong { display: block; font-size: 16px; margin-bottom: 4px; }
        .radio-info small { color: var(--text-secondary); font-size: 12px; }
        .radio-actions button { background: none; border: none; color: var(--text-secondary); font-size: 18px; cursor: pointer; margin-left: 15px; transition: 0.2s; }
        .radio-actions button:hover { color: var(--accent); }
        .radio-actions button.del:hover { color: #ff3b30; }
        
        /* Modal Código */
        #code-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
        .code-box { background: var(--bg-container); width: 100%; max-width: 800px; padding: 30px; border-radius: 20px; border: 1px solid var(--accent); position: relative; }
        textarea { width: 100%; height: 400px; background: #000; color: #00ff00; border: 1px solid var(--border); padding: 15px; font-family: monospace; border-radius: 10px; margin-top: 15px; resize: none; outline: none; }
        .close-code { position: absolute; top: 15px; right: 20px; background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen">
        <h2><i class="fa-solid fa-lock"></i> Radar Admin</h2>
        <div class="input-group">
            <label>Usuário</label>
            <input type="text" id="user" placeholder="Digite o usuário">
        </div>
        <div class="input-group">
            <label>Senha</label>
            <input type="password" id="pass" placeholder="Digite a senha">
        </div>
        <button class="btn" onclick="fazerLogin()">Entrar</button>
        <p id="login-err" style="color: #ff3b30; margin-top: 15px; font-size: 13px; display: none;">Credenciais inválidas.</p>
    </div>

    <!-- PAINEL DE ADMINISTRAÇÃO -->
    <div id="admin-panel">
        <div class="header">
            <h2>Gerenciador de Rádios</h2>
            <button class="btn" style="width: auto; padding: 10px 20px; background: #28a745;" onclick="gerarCodigo()"><i class="fa-solid fa-code"></i> Exportar Código</button>
        </div>

        <div class="grid">
            <!-- Formulário -->
            <div class="form-panel">
                <h3 id="form-title">Adicionar Nova Rádio</h3>
                <input type="hidden" id="edit-id">
                <div class="input-group"><label>Nome da Rádio</label><input type="text" id="f-name" placeholder="Ex: Mix FM"></div>
                <div class="input-group"><label>Frequência</label><input type="text" id="f-freq" placeholder="Ex: 106.3"></div>
                <div class="input-group"><label>Cidade/Estado</label><input type="text" id="f-city" placeholder="Ex: São Paulo - SP"></div>
                <div class="input-group"><label>Gênero</label><input type="text" id="f-genre" placeholder="Ex: Pop-Rock"></div>
                <div class="input-group"><label>Categoria (Badge)</label>
                    <select id="f-badge">
                        <option value="Rádio FM">Rádio FM</option>
                        <option value="Escuta Aérea">Escuta Aérea</option>
                    </select>
                </div>
                <div class="input-group"><label>URL do Áudio (Obrigatório)</label><input type="text" id="f-url" placeholder="https://..."></div>
                <div class="input-group"><label>URL do RDS (Opcional)</label><input type="text" id="f-rds" placeholder="Deixe em branco se não tiver"></div>
                <div class="btn-group">
                    <button class="btn" onclick="salvarRadio()">Salvar Rádio</button>
                    <button class="btn btn-cancel" onclick="limparForm()">Cancelar</button>
                </div>
            </div>

            <!-- Lista Atual -->
            <div class="list-panel" id="radio-list">
                <!-- Preenchido via JS -->
            </div>
        </div>
    </div>

    <!-- MODAL DO CÓDIGO GERADO -->
    <div id="code-modal">
        <div class="code-box">
            <button class="close-code" onclick="fecharModal()">&times;</button>
            <h3 style="color: var(--accent);">Código Atualizado</h3>
            <p style="font-size: 13px; color: var(--text-secondary); margin-top: 5px;">Copie o código abaixo e substitua o array <b>radiosRaw</b> no seu arquivo <b>app.js</b>.</p>
            <textarea id="output-code" readonly></textarea>
            <button class="btn" onclick="copiarCodigo()" style="margin-top: 15px;"><i class="fa-regular fa-copy"></i> Copiar Código</button>
        </div>
    </div>

    <script>
        // Credenciais Ofuscadas (Base64) - Não mexer
        const _u = "UmFkYXJSYWRpb3M=";
        const _p = "QGx0aGllcmVzVE0=";

        // Base inicial de dados (pode estar vazia, o usuário adiciona)
        let radios = [];

        function fazerLogin() {
            const user = document.getElementById("user").value;
            const pass = document.getElementById("pass").value;
            
            // Verifica desencriptando a Base64 no momento da checagem
            if (user === atob(_u) && pass === atob(_p)) {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("admin-panel").style.display = "block";
                
                // Tenta carregar do LocalStorage se tivermos salvo um rascunho anterior no painel
                const saved = localStorage.getItem("radar_admin_rascunho");
                if (saved) radios = JSON.parse(saved);
                
                renderLista();
            } else {
                document.getElementById("login-err").style.display = "block";
            }
        }

        function gerarId(nome) {
            return nome.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, "");
        }

        function salvarRadio() {
            const name = document.getElementById("f-name").value.trim();
            const freq = document.getElementById("f-freq").value.trim();
            const city = document.getElementById("f-city").value.trim();
            const genre = document.getElementById("f-genre").value.trim();
            const url = document.getElementById("f-url").value.trim();
            const rds = document.getElementById("f-rds").value.trim();
            const badge = document.getElementById("f-badge").value;
            const editId = document.getElementById("edit-id").value;

            if (!name || !freq || !url) { alert("Nome, Frequência e URL do Áudio são obrigatórios!"); return; }

            const novaRadio = {
                id: editId ? editId : gerarId(name),
                name, freq, city, genre, url, badge
            };
            if (rds) novaRadio.rds = rds;

            if (editId) {
                const index = radios.findIndex(r => r.id === editId);
                if (index !== -1) radios[index] = novaRadio;
            } else {
                radios.push(novaRadio);
            }

            // Ordenar por frequência automaticamente
            radios.sort((a, b) => parseFloat(a.freq) - parseFloat(b.freq));

            // Salvar rascunho local no navegador do admin
            localStorage.setItem("radar_admin_rascunho", JSON.stringify(radios));
            
            limparForm();
            renderLista();
        }

        function renderLista() {
            const listEl = document.getElementById("radio-list");
            listEl.innerHTML = "";
            
            if (radios.length === 0) {
                listEl.innerHTML = "<p style='color: #888; text-align: center; padding: 20px;'>Nenhuma rádio cadastrada. Comece a adicionar ao lado.</p>";
                return;
            }

            radios.forEach(r => {
                const item = document.createElement("div");
                item.className = "radio-item";
                item.innerHTML = `
                    <div class="radio-info">
                        <strong>${r.name} (${r.freq})</strong>
                        <small>${r.city} • ${r.badge}</small>
                    </div>
                    <div class="radio-actions">
                        <button onclick="editarRadio('${r.id}')" title="Editar"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button class="del" onclick="apagarRadio('${r.id}')" title="Excluir"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        function editarRadio(id) {
            const r = radios.find(rad => rad.id === id);
            if (!r) return;
            
            document.getElementById("form-title").innerText = "Editar Rádio";
            document.getElementById("edit-id").value = r.id;
            document.getElementById("f-name").value = r.name;
            document.getElementById("f-freq").value = r.freq;
            document.getElementById("f-city").value = r.city;
            document.getElementById("f-genre").value = r.genre;
            document.getElementById("f-badge").value = r.badge || "Rádio FM";
            document.getElementById("f-url").value = r.url;
            document.getElementById("f-rds").value = r.rds || "";
        }

        function apagarRadio(id) {
            if(confirm("Tem certeza que deseja apagar esta rádio?")) {
                radios = radios.filter(r => r.id !== id);
                localStorage.setItem("radar_admin_rascunho", JSON.stringify(radios));
                renderLista();
            }
        }

        function limparForm() {
            document.getElementById("form-title").innerText = "Adicionar Nova Rádio";
            document.getElementById("edit-id").value = "";
            document.getElementById("f-name").value = "";
            document.getElementById("f-freq").value = "";
            document.getElementById("f-city").value = "";
            document.getElementById("f-genre").value = "";
            document.getElementById("f-badge").value = "Rádio FM";
            document.getElementById("f-url").value = "";
            document.getElementById("f-rds").value = "";
        }

        function gerarCodigo() {
            let codigo = "const radiosRaw = [\n";
            radios.forEach(r => {
                let rdsStr = r.rds ? `, rds: "${r.rds}"` : "";
                codigo += `    { id: "${r.id}", name: "${r.name}", freq: "${r.freq}", city: "${r.city}", genre: "${r.genre}", url: "${r.url}"${rdsStr}, badge: "${r.badge}" },\n`;
            });
            codigo += "];";
            
            document.getElementById("output-code").value = codigo;
            document.getElementById("code-modal").style.display = "flex";
        }

        function fecharModal() {
            document.getElementById("code-modal").style.display = "none";
        }

        function copiarCodigo() {
            const text = document.getElementById("output-code");
            text.select();
            document.execCommand("copy");
            alert("Código copiado! Cole agora no início do seu arquivo app.js");
        }
    </script>
</body>
</html>
